services:
  mathmap:
    build: .
    ports:
      - "3000:3000"
    environment:
      # basic (default): seed MSC + Wikidata on first run
      # full: also fetch Wikipedia summaries (~15 min extra, rate-limited)
      # none: skip seeding
      AUTO_INGEST: ${AUTO_INGEST:-basic}
      # Optional: enables the AI analysis method without pasting a key in the UI
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - mathmap-data:/app/.data

volumes:
  mathmap-data:
