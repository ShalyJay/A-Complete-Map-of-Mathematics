services:
  mathmap:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Optional: enables the AI analysis method without pasting a key in the UI
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Local NLP model and embedding caches
      - mathmap-data:/app/.data

volumes:
  mathmap-data:
